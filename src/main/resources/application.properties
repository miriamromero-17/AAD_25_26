spring.application.name=add
# -----------------------------
# BASE DE DATOS
# -----------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/aad_db
spring.datasource.username=user
spring.datasource.password=pass
spring.datasource.driver-class-name=org.postgresql.Driver
# -----------------------------
# JPA / HIBERNATE
# -----------------------------
# Crea las tablas automáticamente al arrancar y cuando cierras la app las tablas se eliminan
spring.jpa.hibernate.ddl-auto=create-drop
# NO mostrar cada SELECT/INSERT
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# -----------------------------
# LOGS LIMPIOS
# -----------------------------
# Mostrar solo creación del esquema
logging.level.root=INFO
logging.level.org.hibernate.tool.schema=DEBUG
# Quitar spam SQL gigante
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
# -----------------------------
# SQL INIT
# -----------------------------
spring.sql.init.mode=never