spring:
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: group-1
      auto-offset-reset: earliest

  datasource:
    url: jdbc:postgresql://localhost:5434/mensajesdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080